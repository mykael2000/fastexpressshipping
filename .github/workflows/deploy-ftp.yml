name: Deploy via SFTP

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed files
        id: changes
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '^(resources/|public/|package\.json|package-lock\.json|vite\.config\.)' > /dev/null; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, ctype, fileinfo, openssl, pdo, tokenizer, xml, dom, curl

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-progress

      - name: Set up Node.js
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install JS dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Build assets
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          set -e
          rm -rf deploy_bundle
          mkdir -p deploy_bundle/app

          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=tests \
            --exclude=.env \
            --exclude=storage \
            --exclude=public \
            --exclude=deploy_bundle \
            --exclude=deploy_webroot \
            --exclude=deploy_app_protect \
            -cf - . | tar -xf - -C deploy_bundle/app

          shopt -s dotglob
          cp -R public/* deploy_bundle/
          shopt -u dotglob

          sed -i "s#__DIR__\.'/../vendor/autoload.php'#__DIR__.'\/app\/vendor\/autoload.php'#g" deploy_bundle/index.php
          sed -i "s#__DIR__\.'/../bootstrap/app.php'#__DIR__.'\/app\/bootstrap\/app.php'#g" deploy_bundle/index.php

          cat > deploy_bundle/app/.htaccess <<'EOF'
          Require all denied
          EOF

      - name: Upload bundle to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT }}
          source: "deploy_bundle/*,deploy_bundle/.htaccess"
          target: "./"
          strip_components: 1
          overwrite: true

